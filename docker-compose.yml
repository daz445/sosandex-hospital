services:
  # ── Реляционная СУБД ──
  db:
    image: postgres:16-alpine
    container_name: hospital-db
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Веб-интерфейс для управления СУБД ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hospital-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hospital.local
      PGADMIN_DEFAULT_PASSWORD: lab12-admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "8084:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Микросервис (multi-stage сборка через Dockerfile) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-app
    depends_on:
      db:
        condition: service_healthy   # стартуем после готовности СУБД
    environment:
      DATABASE_URL: postgresql+asyncpg://hospital:hospital@db:5432/hospital
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
